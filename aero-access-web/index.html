<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aero Access Web</title>

        <img

</header>

<div class="container">

    <div class="card">

            <p class="profile-subtitle">

            <button

                    onclick="location.href='login-agent.html'">

</div>

<script>
    function go(page){
      window.location.href = page;
    }
