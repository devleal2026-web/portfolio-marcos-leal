<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Passageiro</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="menu-container"></div>

<div class="container">

    <div class="card">

        <h2>Cadastro de Passageiro</h2>

        <input
                type="text"
                id="name"
                placeholder="Nome Completo">

        <input
                type="text"
                id="whatsapp"
                placeholder="WhatsApp">

        <input
                type="email"
                id="email"
                placeholder="E-mail">

        <input
                type="password"
                id="password"
                placeholder="Senha">

        <input
                type="password"
                id="confirmPassword"
                placeholder="Confirmar Senha">

        <button onclick="registerPassenger()">
            Cadastrar
        </button>

        <br><br>

        <button
                onclick="location.href='login-passenger.html'">

            Já possuo cadastro

        </button>

        <p id="message"></p>

    </div>

</div>

<script type="module">
    import "./register-passenger.js";
</script>

</body>
</html>
