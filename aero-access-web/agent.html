<!DOCTYPE html>

<html lang="pt-BR">

<head>

    ```
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>
        Área do Agente
    </title>

    <link
            rel="stylesheet"
            href="styles.css">
    ```

</head>

<body>

```
<div id="menu-container"></div>

<div id="app">

    <h2>
        Solicitações
    </h2>

    <div id="list"></div>

</div>

<!-- CHAT -->

<div
        id="chatContainer"
        style="
        display:none;
        position:fixed;
        right:20px;
        bottom:20px;
        width:350px;
        height:500px;
        background:#fff;
        border:1px solid #ccc;
        border-radius:10px;
        box-shadow:0 0 15px rgba(0,0,0,.2);
        z-index:9999;
    ">

    <div
            style="
            background:#0057b8;
            color:white;
            padding:10px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        ">

        <strong>
            Chat Atendimento
        </strong>

        <button
                onclick="closeChat()">

            X

        </button>

    </div>

    <div
            id="chatMessages"
            style="
            height:380px;
            overflow-y:auto;
            padding:10px;
        ">
    </div>

    <div
            style="
            display:flex;
            gap:5px;
            padding:10px;
        ">

        <input
                id="chatInput"
                type="text"
                placeholder="Digite uma mensagem..."
                style="
                flex:1;
            ">

        <button
                onclick="sendMessage()">

            Enviar

        </button>

    </div>

</div>

<script type="module">

    import "./agent.js";

    import {
        criarMenu
    } from "./layout.js";

    criarMenu(
        "Área do Agente"
    );

</script>
```

</body>

</html>
