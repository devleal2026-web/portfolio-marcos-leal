<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Passageiro - Aero Access</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <img
                src="images/logo-aero-access.png"
                alt="Aero Access"
                class="page-logo">

        <h2>Cadastro de Passageiro</h2>

        <form id="registerPassengerForm">
            <input id="name" type="text" placeholder="Nome completo" required>

            <input id="phone" type="tel" placeholder="WhatsApp" required>

            <input id="email" type="email" placeholder="E-mail" required>

            <select id="companyId" required>
                <option value="">Carregando empresas...</option>
            </select>

            <input id="password" type="password" placeholder="Senha" required>

            <input id="confirmPassword" type="password" placeholder="Confirmar senha" required>

            <button type="submit">Cadastrar</button>
        </form>

        <button class="secondary" type="button" onclick="location.href='login-passenger.html'">
            Já possuo cadastro
        </button>

        <button class="secondary" type="button" onclick="location.href='index.html'">
            Voltar
        </button>

        <p id="message"></p>
    </div>
</div>

<script type="module" src="register-passenger.js"></script>

</body>
</html>
