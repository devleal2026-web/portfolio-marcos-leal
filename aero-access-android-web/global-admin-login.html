<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Global - Aero Access</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <div class="card">
        <img src="images/logo-aero-access.png" alt="Aero Access" class="page-logo">

        <h2>Admin Global Aero Access</h2>

        <form id="globalAdminLoginForm">
            <input id="email" type="email" placeholder="E-mail Aero Access" required>
            <input id="password" type="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        <button class="secondary" type="button" onclick="location.href='index.html'">
            Voltar
        </button>

        <p id="message"></p>
    </div>
</div>

<script type="module" src="global-admin-login.js"></script>

</body>
</html>
