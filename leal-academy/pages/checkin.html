<div class="container-fluid p-4">

    <h1 class="mb-4">

        Check-In de Bagagens

    </h1>

    <div class="row">

        <div class="col-lg-4 mb-3">

            <div class="card bg-dark text-light h-100">

                <div class="card-body">

                    <h4>

                        Nova Bagagem

                    </h4>

                    <button id="btnNovaBagagem"
                            class="btn btn-primary w-100">

                        Gerar Bagagem

                    </button>

                </div>

            </div>

        </div>

        <div class="col-lg-8 mb-3">

            <div class="card bg-dark text-light h-100">

                <div class="card-body">

                    <h4>

                        Indicadores

                    </h4>

                    <div class="row text-center">

                        <div class="col">

                            <h2 id="totalCheckin">0</h2>

                            <small>CHECK-IN</small>

                        </div>

                        <div class="col">

                            <h2 id="totalVoos">0</h2>

                            <small>VOOS</small>

                        </div>

                        <div class="col">

                            <h2 id="totalPeso">0</h2>

                            <small>KG</small>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <div class="card bg-dark text-light mt-4">

        <div class="card-body">

            <h4 class="mb-3">

                Bagagens Recebidas

            </h4>

            <div class="table-responsive">

                <table class="table table-dark table-hover align-middle">

                    <thead>

                    <tr>

                        <th>TAG</th>
                        <th>PASSAGEIRO</th>
                        <th>PNR</th>
                        <th>VOO</th>
                        <th>ROTA</th>
                        <th>PESO</th>
                        <th>STATUS</th>

                    </tr>

                    </thead>

                    <tbody id="listaBagagens">

                    </tbody>

                </table>

            </div>

        </div>
