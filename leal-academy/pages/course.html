<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Curso - Airport Baggage Academy</title>
    <link rel="stylesheet" href="../css/academy.css?v=20260903-security-mobile">
    <script src="../js/academy-theme.js?v=20260823-accent-v2"></script>
    <style>
        body{
            margin:0;
            background:#edf2f5;
            color:#102033;
            font-family:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
        }

        .course-page-shell{
            min-height:100vh;
            padding:26px;
        }

        .course-page-header{
            display:flex;
            align-items:flex-start;
            gap:24px;
            color:#ffffff;
            border-radius:22px;
            padding:26px;
            margin-bottom:22px;
            background-size:cover;
            background-position:center;
            position:relative;
            overflow:hidden;
            box-shadow:0 18px 45px rgba(15,23,42,.12);
        }

        .course-page-header::before{
            content:"";
            position:absolute;
            inset:0;
            background:rgba(2,6,23,.36);
        }

        .course-page-header > *{
            position:relative;
            z-index:1;
        }

        .course-header-logo{
            width:78px;
            height:78px;
            object-fit:cover;
            flex:none;
            border:1px solid rgba(255,255,255,.42);
            border-radius:18px;
            box-shadow:0 14px 32px rgba(15,23,42,.22);
        }

        .back-link{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            color:#0f172a;
            background:rgba(255,255,255,.95);
            border:1px solid #dbe6ee;
            border-radius:10px;
            padding:10px 14px;
            text-decoration:none;
            font-weight:800;
        }

        .academy-kicker{
            margin:0 0 6px;
            color:#e8f7ee;
            text-transform:uppercase;
            font-weight:800;
            letter-spacing:.08em;
            font-size:12px;
        }

        .course-page-header h1{
            margin:0;
            max-width:860px;
            font-size:38px;
            line-height:1.12;
            letter-spacing:0;
        }

        .course-page-header p{
            color:#e8f7ee;
            margin:8px 0 0;
            max-width:760px;
            line-height:1.55;
        }

        .course-meta-row{
            margin-left:auto;
            display:flex;
            flex-wrap:wrap;
            justify-content:flex-end;
            gap:10px;
        }

        .course-meta-row span{
            background:rgba(255,255,255,.16);
            border:1px solid rgba(255,255,255,.35);
            border-radius:999px;
            color:#ffffff;
            padding:8px 12px;
            font-weight:800;
        }

        .course-guide,
        .course-content-panel,
        .course-side-panel{
            background:#ffffff;
            border:1px solid #dbe6ee;
            border-radius:16px;
            box-shadow:0 10px 26px rgba(15,23,42,.07);
        }

        .course-guide{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:18px;
            padding:18px;
            margin-bottom:22px;
        }

        .section-title{
            margin:8px 0 16px;
            font-size:24px;
        }

        .track-grid{
            display:grid;
            grid-template-columns:repeat(4,minmax(0,1fr));
            gap:14px;
            margin-bottom:22px;
        }

        .track-card{
            min-height:160px;
            text-align:left;
            border:1px solid #cbd5e1;
            border-radius:14px;
            background:linear-gradient(180deg,#ffffff,#f8fafc);
            padding:16px;
            cursor:pointer;
            box-shadow:0 8px 18px rgba(15,23,42,.06);
            font:inherit;
        }

        .track-card.active,
        .track-card:hover{
            border-color:#15803d;
            background:linear-gradient(180deg,#f0fdf4,#ffffff);
            box-shadow:0 16px 32px rgba(15,23,42,.12);
        }

        .course-content-layout{
            display:grid;
            grid-template-columns:minmax(0,1fr) 390px;
            gap:20px;
            align-items:start;
        }

        .course-content-panel,
        .course-side-panel{
            padding:18px;
        }

        @media(max-width:1180px){
            .track-grid{
                grid-template-columns:repeat(2,minmax(0,1fr));
            }

            .course-content-layout{
                grid-template-columns:1fr;
            }
        }

        @media(max-width:720px){
            .course-page-shell{
                padding:14px;
            }

            .course-page-header,
            .course-guide{
                flex-direction:column;
            }

            .course-meta-row{
                margin-left:0;
                justify-content:flex-start;
            }

            .track-grid{
                grid-template-columns:1fr;
            }

            .course-page-header h1{
                font-size:30px;
            }
        }
    </style>
</head>
<body data-academy-protected="true">

<div class="course-page-shell">
    <header class="course-page-header">
        <a class="back-link" href="academy.html">Voltar aos cursos</a>
        <img class="course-header-logo" src="../assets/brand/leal-academy-logo.png" alt="Leal Academy">
        <div>
            <p id="courseEyebrow" class="academy-kicker"></p>
            <h1 id="courseTitle"></h1>
            <p id="courseSummary"></p>
        </div>
        <div class="course-meta-row">
            <span id="courseDuration"></span>
            <span id="courseLevel"></span>
            <span id="courseProgress"></span>
        </div>
    </header>

    <section id="courseGuide" class="course-guide"></section>

    <section>
        <h2 class="section-title">Trilhas do curso</h2>
        <div id="trackGrid" class="track-grid"></div>
    </section>

    <section class="course-content-layout">
        <article class="course-content-panel">
            <div id="lessonPanel"></div>
        </article>

        <aside class="course-side-panel">
            <div id="courseNavigator"></div>

            <h3>Laboratórios</h3>
            <div id="labLinks" class="lab-links"></div>

            <div id="supportMaterialsBlock" class="support-materials-block">
                <h3>Material de apoio</h3>
                <div id="supportMaterialLinks" class="lab-links"></div>
            </div>

            <h3>Avaliação</h3>
            <div id="assessmentPanel"></div>
        </aside>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/supabase.js?v=20260824-safe-load"></script>
<script src="../js/access-control.js?v=20260827-netlify-short" data-access="protected"></script>
<script src="../js/academy-text.js?v=20260823-accent-v2"></script>
<script src="../js/academy-security.js?v=20260827-content-lock"></script>
<script src="../js/academy-supabase.js?v=20260826-course-category"></script>
<script src="../js/academy.js?v=20260904-libras-official-safe-visuals"></script>

</body>
</html>
