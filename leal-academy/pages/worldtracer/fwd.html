<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWD WorldTracer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/worldtracer.css">
</head>

<body>

<div class="wt-container">
    <header class="wt-header">
        <div class="wt-title">AIRPORT BAGGAGE SIMULATOR</div>
        <div class="wt-subtitle">WORLDTRACER MODE</div>
        <div class="wt-screen">FWD</div>
    </header>

    <section class="wt-info">
        <div>
            <label>REFERENCE</label>
            <input id="action_reference" readonly>
        </div>
        <div>
            <label>STATUS</label>
            <input id="status" readonly>
        </div>
        <div>
            <label>DATE</label>
            <input id="created_at" readonly>
        </div>
    </section>

    <div class="wt-form">
        <div class="wt-row">
            <div class="wt-field">
                <label>FILE REF</label>
                <input id="reference_number" readonly>
            </div>
            <div class="wt-field small">
                <label>ST</label>
                <input id="station" readonly>
            </div>
            <div class="wt-field tiny">
                <label>AL</label>
                <input id="airline" readonly>
            </div>
            <div class="wt-field">
                <label>DEST</label>
                <input id="destination_station" readonly>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>XT / RUSH TAG</label>
                <input id="rush_tag" readonly>
            </div>
            <div class="wt-field">
                <label>TN / ORIGINAL TAG</label>
                <input id="original_tag" readonly>
            </div>
            <div class="wt-field">
                <label>FO / FLIGHT</label>
                <input id="flight" readonly>
            </div>
            <div class="wt-field">
                <label>RT</label>
                <input id="route" readonly>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field small">
                <label>BW</label>
                <input id="weight" readonly>
            </div>
            <div class="wt-field small">
                <label>RL</label>
                <input id="reason_for_loss" readonly>
            </div>
            <div class="wt-field small">
                <label>FS</label>
                <input id="fault_station" readonly>
            </div>
            <div class="wt-field small">
                <label>FA</label>
                <input id="fault_airline" readonly>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>SI</label>
                <textarea id="notes" rows="3" readonly></textarea>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>BAG DETAILS</label>
                <textarea id="bag_description" rows="4" readonly></textarea>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>MESSAGE</label>
                <textarea id="message" rows="10" readonly></textarea>
            </div>
        </div>
    </div>

    <footer class="wt-footer">
        <button id="btnPrint">F3 PRINT</button>
        <button id="btnClose">F10 EXIT</button>
    </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../../js/supabase.js?v=20260825-sita-actions"></script>
<script src="../../js/worldtracer-operational-action.js?v=20260825-sita-actions"></script>

</body>
</html>
