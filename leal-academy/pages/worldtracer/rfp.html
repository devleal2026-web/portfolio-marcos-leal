<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>RFP WorldTracer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/worldtracer.css">
</head>

<body>

<div class="wt-container">

    <header class="wt-header">
        <div class="wt-title">AIRPORT BAGGAGE SIMULATOR</div>
        <div class="wt-subtitle">WORLDTRACER MODE</div>
        <div class="wt-screen">RFP</div>
    </header>

    <section class="wt-info wt-info-ohd">
        <div>
            <label>STATION</label>
            <select id="station"></select>
        </div>

        <div>
            <label>AIRLINE</label>
            <select id="airline"></select>
        </div>

        <div>
            <label>REFERENCE</label>
            <input id="reference_number" readonly>
        </div>

        <div>
            <label>STATUS</label>
            <input id="status" readonly>
        </div>

        <div>
            <label>DATE</label>
            <input id="created_at" readonly>
        </div>
    </section>

    <div class="wt-form">

        <div class="wt-row">
            <div class="wt-field small">
                <label>FP</label>
                <input id="found_location">
            </div>

            <div class="wt-field small">
                <label>FD</label>
                <input id="found_date">
            </div>

            <div class="wt-field small">
                <label>FT</label>
                <input id="found_time">
            </div>

            <div class="wt-field small">
                <label>FB</label>
                <input id="found_by">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>FL</label>
                <input id="flight_number">
            </div>

            <div class="wt-field">
                <label>FDATE</label>
                <input id="flight_date">
            </div>

            <div class="wt-field xl">
                <label>RT</label>
                <input id="route">
            </div>

            <div class="wt-field tiny">
                <label>SEAT</label>
                <input id="seat">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field small">
                <label>CA</label>
                <select id="category"></select>
            </div>

            <div class="wt-field tiny">
                <label>QT</label>
                <input id="item_count">
            </div>

            <div class="wt-field">
                <label>BRAND</label>
                <input id="item_brand">
            </div>

            <div class="wt-field">
                <label>COLOR</label>
                <input id="item_color">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>DD - DETAILED DESCRIPTION</label>
                <textarea id="detailed_description" rows="5"></textarea>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field xl">
                <label>NM</label>
                <input id="passenger_name">
            </div>

            <div class="wt-field">
                <label>CP</label>
                <input id="passenger_phone">
            </div>

            <div class="wt-field">
                <label>EA</label>
                <input id="passenger_email">
            </div>

            <div class="wt-field">
                <label>DOC</label>
                <input id="passenger_document">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>SL</label>
                <input id="storage_location">
            </div>

            <div class="wt-field">
                <label>SS</label>
                <select id="storage_status"></select>
            </div>

            <div class="wt-field">
                <label>SU</label>
                <input id="storage_until">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>XT</label>
                <input id="rush_tag">
            </div>

            <div class="wt-field xl">
                <label>AI02</label>
                <input id="ai02">
            </div>

            <div class="wt-field">
                <label>FW</label>
                <input id="forwarded_to">
            </div>

            <div class="wt-field">
                <label>FO</label>
                <input id="forwarded_flight">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>DT</label>
                <input id="delivered_to">
            </div>

            <div class="wt-field">
                <label>DDOC</label>
                <input id="delivered_document">
            </div>

            <div class="wt-field">
                <label>DAT</label>
                <input id="delivered_at">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>SI / NOTES</label>
                <textarea id="notes" rows="4"></textarea>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>HISTORY</label>
                <textarea id="history" rows="5" readonly></textarea>
            </div>
        </div>

    </div>

    <footer class="wt-footer">
        <button id="btnSave">F1 SAVE</button>
        <button id="btnClear">F2 CLEAR</button>
        <button id="btnPrint">F3 PRINT</button>
        <button id="btnClose">F10 EXIT</button>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../../js/supabase.js"></script>
<script src="../../js/worldtracer-rfp.js"></script>

</body>
</html>
