<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPR WorldTracer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/worldtracer.css">
</head>

<body>

<div class="wt-container">

    <header class="wt-header">
        <div class="wt-title">AIRPORT BAGGAGE SIMULATOR</div>
        <div class="wt-subtitle">WORLDTRACER MODE</div>
        <div class="wt-screen">DPR</div>
    </header>

    <section class="wt-info wt-info-ohd">
        <div>
            <label>STATION</label>
            <select id="station"></select>
        </div>

        <div>
            <label>AIRLINE</label>
            <select id="airline"></select>
        </div>

        <div>
            <label>REFERENCE</label>
            <input id="reference_number" readonly>
        </div>

        <div>
            <label>STATUS</label>
            <input id="status" readonly>
        </div>

        <div>
            <label>DATE</label>
            <input id="created_at" readonly>
        </div>
    </section>

    <div class="wt-form">

        <div class="wt-row">
            <div class="wt-field small">
                <label>TN</label>
                <input id="tn">
            </div>

            <div class="wt-field full">
                <label>NM</label>
                <input id="nm">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>FD</label>
                <input id="fd">
            </div>

            <div class="wt-field xl">
                <label>RT</label>
                <input id="rt">
            </div>

            <div class="wt-field">
                <label>CO</label>
                <input id="co">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field small">
                <label>RL</label>
                <input id="rl">
            </div>

            <div class="wt-field small">
                <label>FS</label>
                <input id="fs">
            </div>

            <div class="wt-field">
                <label>PN</label>
                <input id="pn">
            </div>

            <div class="wt-field">
                <label>AG</label>
                <input id="ag">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>CT</label>
                <input id="ct">
            </div>

            <div class="wt-field">
                <label>BI</label>
                <input id="bi">
            </div>

            <div class="wt-field tiny">
                <label>BW</label>
                <input id="bw">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>LP</label>
                <input id="lp">
            </div>

            <div class="wt-field">
                <label>BD</label>
                <input id="bd">
            </div>

            <div class="wt-field">
                <label>CD</label>
                <input id="cd">
            </div>

            <div class="wt-field">
                <label>TD</label>
                <input id="td">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>RB</label>
                <input id="rb">
            </div>

            <div class="wt-field">
                <label>CA</label>
                <input id="ca">
            </div>

            <div class="wt-field xl">
                <label>FF</label>
                <input id="ff">
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field">
                <label>ELEMENT</label>
                <select id="damage_element"></select>
            </div>

            <div class="wt-field">
                <label>LOCATION</label>
                <select id="damage_location"></select>
            </div>

            <div class="wt-field">
                <label>EXTENT</label>
                <select id="damage_extent"></select>
            </div>
        </div>

        <div class="wt-row">
            <div class="wt-field full">
                <label>DAMAGE DESCRIPTION</label>
                <textarea id="damage_description" rows="4"></textarea>
            </div>
        </div>

    </div>

    <footer class="wt-footer">
        <button id="btnSave">F1 SAVE</button>
        <button id="btnClear">F2 CLEAR</button>
        <button id="btnPrint">F3 PRINT</button>
        <button id="btnHistory">F4 HISTORY</button>
        <button id="btnClose">F10 EXIT</button>
    </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="../../js/supabase.js?v=20260824-friendly"></script>
<script src="../../js/access-control.js" data-access="protected"></script>
<script src="../../js/dpr-codes.js"></script>
<script src="../../js/worldtracer-dpr.js"></script>

</body>
</html>
