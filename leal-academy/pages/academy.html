<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta name="description" content="Leal Academy: plataforma de treinamento operacional aeroportuario com cursos, simulador de bagagem, biblioteca tecnica e acompanhamento de desempenho.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.lealacademy.com.br/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Leal Academy">
    <meta property="og:title" content="Leal Academy | Treinamento Operacional Aeroportuario">
    <meta property="og:description" content="Treinamento operacional aeroportuario com cursos, simulador de bagagem e biblioteca tecnica.">
    <meta property="og:url" content="https://www.lealacademy.com.br/">
    <meta property="og:image" content="https://www.lealacademy.com.br/leal-academy/assets/brand/leal-academy-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="../assets/brand/leal-academy-logo.png">
    <link rel="apple-touch-icon" href="../assets/brand/leal-academy-logo.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Leal Academy",
      "alternateName": "Airport Baggage Academy",
      "url": "https://www.lealacademy.com.br/",
      "description": "Plataforma de treinamento operacional aeroportuario com cursos, simulador de bagagem, biblioteca tecnica e acompanhamento de desempenho.",
      "publisher": {
        "@type": "Organization",
        "name": "Leal Academy",
        "url": "https://www.lealacademy.com.br/",
        "logo": "https://www.lealacademy.com.br/leal-academy/assets/brand/leal-academy-logo.png"
      }
    }
    </script>
    <title>Leal Academy | Treinamento Operacional Aeroportuario</title>
    <link rel="stylesheet" href="../css/academy.css?v=20260903-security-mobile">
    <script src="../js/academy-theme.js?v=20260823-accent-v2"></script>
</head>
<body data-academy-protected="true">

<main class="academy-home">
    <header class="academy-home-header">
        <div class="academy-brand-lockup">
            <img src="../assets/brand/leal-academy-logo.png" alt="Leal Academy">
            <div>
                <p class="academy-kicker">Airport Baggage Simulator</p>
                <h1>Leal Academy</h1>
            </div>
        </div>
        <nav class="academy-home-actions">
            <a href="../index.html">Simulador</a>
            <a href="operational-library.html">Biblioteca</a>
        </nav>
    </header>

    <section class="academy-welcome-card">
        <div>
            <span>Treinamento operacional</span>
            <h2 id="academyWelcomeTitle">Olá. Escolha seu curso.</h2>
        </div>
        <div class="academy-counts">
            <strong id="homeCourseCount">0</strong>
            <span>cursos disponíveis</span>
        </div>
    </section>

    <section class="academy-filter-panel" aria-label="Buscar cursos">
        <label for="courseSearch">Buscar curso</label>
        <input
            id="courseSearch"
            type="search"
            placeholder="Digite AHL, OHD, DPR, atendimento, bagagem ou segurança">
    </section>

    <section id="courseGrid" class="course-grid-cards"></section>

    <button
        id="academyFloatingTop"
        class="academy-floating-top"
        type="button"
        aria-label="Voltar ao topo"
        title="Voltar ao topo">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M3 11.5L12 4l9 7.5"></path>
            <path d="M5.5 10.5V20h13v-9.5"></path>
            <path d="M9.5 20v-6h5v6"></path>
        </svg>
    </button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/supabase.js?v=20260824-safe-load"></script>
<script src="../js/access-control.js?v=20260827-netlify-short" data-access="protected"></script>
<script src="../js/academy-text.js?v=20260823-accent-v2"></script>
<script src="../js/academy-security.js?v=20260827-content-lock"></script>
<script src="../js/academy-supabase.js?v=20260826-course-category"></script>
<script src="../js/academy.js?v=20260904-libras-remove-trilha10"></script>

</body>
</html>
