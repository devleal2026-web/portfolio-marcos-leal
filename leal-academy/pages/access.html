<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Seguro - Leal Academy</title>
    <link rel="stylesheet" href="../css/academy.css?v=20260823-supabase-source-v4">
    <script src="../js/academy-theme.js?v=20260823-supabase-source-v4"></script>
</head>
<body>

<main class="academy-auth-page">
    <section class="academy-auth-card">
        <div class="academy-auth-copy">
            <img class="academy-auth-logo" src="../assets/brand/leal-academy-logo.png" alt="Leal Academy">
            <p class="academy-kicker">Acesso seguro</p>
            <h1>Leal Academy</h1>
            <p>
                Entre com sua conta Google para acessar a plataforma e o simulador.
                No primeiro acesso, confirme seu nome para personalizar seu treinamento.
            </p>
        </div>

        <div id="authSignedOut" class="academy-auth-form">
            <label>Conta autorizada</label>
            <button id="btnGoogleAccess" type="button">Entrar com Google</button>
            <div id="authMessage" class="academy-auth-message" role="status"></div>
        </div>

        <form id="authProfileForm" class="academy-auth-form" autocomplete="on" hidden>
            <label for="authFullName">Nome completo</label>
            <input
                id="authFullName"
                name="name"
                type="text"
                placeholder="Ex.: Marcos Leal"
                autocomplete="name"
                required>

            <label for="authEmail">E-mail autenticado</label>
            <input
                id="authEmail"
                name="email"
                type="email"
                readonly>

            <button type="submit">Concluir acesso</button>
            <button id="btnLogoutProfile" type="button" class="academy-auth-secondary">Sair desta conta</button>
            <div id="authProfileMessage" class="academy-auth-message" role="status"></div>
        </form>

        <div id="authSignedIn" class="academy-auto-access" hidden>
            <span>Acesso autenticado</span>
            <strong id="authUserName"></strong>
            <p id="authUserEmail"></p>
            <div class="academy-auth-actions">
                <button id="btnContinueAccess" type="button">Continuar</button>
                <button id="btnLogoutAccess" type="button">Sair</button>
            </div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/access-control.js?v=20260823-supabase-source-v4" data-access="login"></script>
</body>
</html>
