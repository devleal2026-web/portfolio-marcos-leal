<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>

        Airport Baggage Simulator

    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="wrapper">

    <aside class="sidebar">

        <div class="logo">

            ABS

        </div>

        <div class="operator-panel">

            <div id="operatorName">

                Operador

            </div>

            <div id="operatorRole">

                Cargo

            </div>

        </div>

        <nav>

            <a href="#">Dashboard</a>

            <a href="pages/academy-access.html">
                Cursos
            </a>

            <a href="pages/checkin.html">
                Check-In
            </a>

            <a href="pages/bhs.html">
                BHS
            </a>

            <a href="pages/makeup.html">
                Make-Up
            </a>

            <a href="pages/loading.html">
                Loading
            </a>

            <a href="pages/ohd.html">
                OHD
            </a>

            <a href="pages/ahl.html">
                AHL
            </a>

            <a href="pages/dpr.html">DPR</a>

            <a href="pages/rfp.html">RFP</a>

            <a href="pages/action-file.html">Action File</a>

            <a href="pages/operational-library.html">
                Biblioteca Operacional
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <h1>

                Airport Baggage Simulator

            </h1>

            <span id="clock">

            </span>

        </header>

        <div class="container-fluid mt-4">

            <div class="row g-4">

                <div class="col-lg-3">

                    <div class="kpi-card">

                        <h5>CHECK-IN</h5>

                        <span id="checkinCount">

                            0

                        </span>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="kpi-card">

                        <h5>BHS</h5>

                        <span id="bhsCount">

                            0

                        </span>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="kpi-card">

                        <h5>MAKEUP</h5>

                        <span id="makeupCount">

                            0

                        </span>

                    </div>

                </div>

                <div class="col-lg-3">

                    <div class="kpi-card">

                        <h5>LOADING</h5>

                        <span id="loadingCount">

                            0

                        </span>

                    </div>

                </div>

            </div>

            <div class="dashboard-panel mt-4">

                <h3>

                    Operação em Tempo Real

                </h3>

                <table class="table table-dark table-hover">

                    <thead>

                    <tr>

                        <th>TAG</th>

                        <th>VOO</th>

                        <th>DESTINO</th>

                        <th>STATUS</th>

                    </tr>

                    </thead>

                    <tbody id="bagTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="js/supabase.js"></script>
<script src="js/access-control.js" data-access="protected"></script>

<script src="js/dashboard.js"></script>

</body>

</html>
